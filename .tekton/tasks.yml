apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cicd-workspace-task
spec:
  workspaces:
    - name: source
  steps:
    # 1. Langkah Test Task (Menggunakan Jest)
    - name: run-tests
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        npm ci
        npm test

    # 2. Langkah Cleanup Task
    - name: cleanup-workspace
      image: alpine:latest
      workingDir: $(workspaces.source.path)
      script: |
        echo "Memulai pembersihan workspace..."
        rm -rf node_modules
        echo "Workspace berhasil dibersihkan."
