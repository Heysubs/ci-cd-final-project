name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Langkah Lint menggunakan ESLint
    - name: Run Lint Check
      run: npm run lint
      # Catatan: Memastikan script lint menjalankan "eslint ." di package.json

    # Langkah Unit Test menggunakan Jest
    - name: Run Unit Tests
      run: npm test
      # Catatan: Memastikan script test menjalankan "jest" atau "react-scripts test --watchAll=false"
